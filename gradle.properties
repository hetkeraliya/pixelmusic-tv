# Gradle properties for memory optimization
org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=2g -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8 -XX:+UseG1GC
org.gradle.parallel=true
org.gradle.configureondemand=true
org.gradle.daemon=false
kotlin.daemon.jvm.options=-Xmx4g -XX:MaxMetaspaceSize=2g

# AndroidX settings
android.useAndroidX=true
android.enableJetifier=true