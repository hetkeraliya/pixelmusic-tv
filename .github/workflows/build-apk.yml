name: Build TV APK

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build APK
    if: github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Create local.properties
        run: |
          echo "TELEGRAM_API_ID=${{ secrets.TELEGRAM_API_ID }}" > local.properties
          echo "TELEGRAM_API_HASH=${{ secrets.TELEGRAM_API_HASH }}" >> local.properties
          echo "LASTFM_API_KEY=${{ secrets.LASTFM_API_KEY }}" >> local.properties
          echo "LASTFM_SECRET=${{ secrets.LASTFM_SECRET }}" >> local.properties

      - name: Build Debug APK
        run: gradle :tv:assembleDebug --no-daemon --no-configuration-cache

      - name: Upload Debug APK
        uses: actions/upload-artifact@v7
        with:
          name: pixelmusic-tv-debug
          path: tv/build/outputs/apk/debug/*.apk
          retention-days: 7
          if-no-files-found: error
          compression-level: 0

      - name: Setup Release Keystore
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > vz-pixelmusic.jks
          echo "storePassword=${{ secrets.KEYSTORE_PASSWORD }}" > keystore.properties
          echo "keyAlias=${{ secrets.KEY_ALIAS }}" >> keystore.properties
          echo "keyPassword=${{ secrets.KEY_PASSWORD }}" >> keystore.properties

      - name: Build Release APK
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        run: gradle :tv:assembleRelease --no-daemon --no-configuration-cache

      - name: Verify Release APK
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        run: |
          BUILD_TOOLS_VERSION="$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -n 1)"
          for apk in tv/build/outputs/apk/release/*.apk; do
            echo "Verifying $apk..."
            "$ANDROID_HOME/build-tools/$BUILD_TOOLS_VERSION/aapt2" dump badging "$apk" > /dev/null
            "$ANDROID_HOME/build-tools/$BUILD_TOOLS_VERSION/apksigner" verify --verbose "$apk"
          done

      - name: Upload Release APK
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v7
        with:
          name: pixelmusic-tv-release
          path: tv/build/outputs/apk/release/*.apk
          retention-days: 30
          if-no-files-found: error
          compression-level: 0

      - name: Read version name
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        id: version
        run: |
          VERSION_NAME=$(grep '^APP_VERSION_NAME=' gradle.properties | cut -d'=' -f2 | tr -d '[:space:]')
          echo "version_name=$VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "Detected version: $VERSION_NAME"

      - name: Check if version tag already exists
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        id: version_check
        env:
          VERSION_NAME: ${{ steps.version.outputs.version_name }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="v${VERSION_NAME}"
          if git tag --list "$TAG" | grep -q "$TAG"; then
            echo "is_new_version=false" >> "$GITHUB_OUTPUT"
            echo "Tag $TAG already exists locally — NOT a new release."
          else
            echo "is_new_version=true" >> "$GITHUB_OUTPUT"
            echo "Tag $TAG does not exist — this IS a new version. GitHub Release will be created."
          fi

      - name: Create GitHub Release
        if: >
          success() &&
          steps.version_check.outputs.is_new_version == 'true' &&
          github.event_name == 'push' &&
          startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ steps.version.outputs.version_name }}
          name: "PixelMusic TV v${{ steps.version.outputs.version_name }}"
          body: |
            ## What's new
            TV-specific build of PixelMusic

            ---
            | APK | Target |
            |-----|--------|
            | `tv-universal-release.apk` | Android TV (all architectures) |

            **Commit:** ${{ github.sha }}
          files: tv/build/outputs/apk/release/*.apk
          draft: false
          prerelease: false
          make_latest: true